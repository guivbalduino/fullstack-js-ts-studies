<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Gerador de Senhas</title>
</head>
<body>
  <section class="container">
    <h1>Gerador de Senhas</h1>
    <div class="senha-gerada"></div>
    <form class="form-senha">
      <label for="qtd">Quantidade de caracteres</label>
      <input value="6" id="qtd" min="1" max="50" type="number">
      <label for="maiusculas">Adicionar maiúsculas</label>
      <input id="maiusculas" type="checkbox">
      <label for="minusculas">Adicionar minúsculas</label>
      <input id="minusculas" type="checkbox">
      <label for="numeros">Adicionar números</label>
      <input id="numeros" type="checkbox">
      <label for="simbolos">Adicionar símbolos</label>
      <input id="simbolos" type="checkbox">
      <button type="submit">Gerar senha</button>
    </form>
  </section>
  <script src="./assets/js/bundle.js"></script>
</body>
</html>
